<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Survival | Budget Floor Global</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,900;1,900&display=swap');
        
        body, html, #root { 
            height: 100%; margin: 0; padding: 0; overflow-x: hidden;
            background-color: #000; font-family: 'Inter', sans-serif; color: white;
        }

        .concrete-grain {
            position: fixed; inset: 0; opacity: 0.05; pointer-events: none;
            background-image: url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
            z-index: 100;
        }

        .budget-block {
            transition: all 0.2s cubic-bezier(0.19, 1, 0.22, 1);
            border: 2px solid rgba(255,255,255,0.05);
        }

        .budget-block.active {
            background-color: #22d3ee;
            color: #000;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(34, 211, 238, 0.4);
            border-color: #22d3ee;
        }

        .fade-up { animation: fadeUp 0.6s cubic-bezier(0.19, 1, 0.22, 1) forwards; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .scanline {
            width: 100%; height: 100%; background: linear-gradient(to bottom, transparent, rgba(34, 211, 238, 0.02), transparent);
            position: absolute; top: -100%; animation: scan 8s linear infinite;
        }
        @keyframes scan { from { top: -100% } to { top: 100% } }

        * { -webkit-tap-highlight-color: transparent; outline: none; }
    </style>
</head>
<body>
    <div class="concrete-grain"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const Icons = {
            Cart: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>,
            Zap: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>,
            Alert: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>,
            Globe: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
        };

        const TRANSLATIONS = {
            en: {
                title: "BUDGET FLOOR",
                subtitle: "Survival Logistics",
                selector: "Select Current Capital:",
                shopping: "SHOPPING",
                protocol: "The Instructions:",
                reality: "Reality Check",
                rescue: "Locate Nearest Aid",
                footer: "Tactical Build",
                unit: "$",
                tiers: {
                    5: { label: "THE FLOOR", protocol: "Small-bag starch focus. High water volume required to stretch satiety.", reality: "CRITICAL: Under $5 in 2026 is emergency territory. Seek aid." },
                    10: { label: "FOUNDATION", protocol: "Oats for breakfast. Rice + 1 Egg for dinner. Beans for protein stability.", reality: "ENERGY STABLE: No luxury items. Just raw fuel." },
                    15: { label: "THE BUFFER", protocol: "Adding healthy fats. Peanut butter acts as the caloric floor.", reality: "SECURE: Fat added for brain function." },
                    20: { label: "THE PEAK", protocol: "Complete nutritional profile. Sauté greens into the grain base.", reality: "OPTIMAL: All major food groups represented." },
                    25: { label: "EFFICIENCY", protocol: "Texture variety. Pasta rotation reduces the psychological burden.", reality: "VARIETY: Slower burnout rate." },
                    30: { label: "TRANSITION", protocol: "Flavor aromatics added. Onions and spice restore dignity to the meal.", reality: "HUMAN: Cooking, not just feeding." }
                }
            },
            fr: {
                title: "SEUIL CRITIQUE",
                subtitle: "Logistique de Survie",
                selector: "Sélectionnez le Capital :",
                shopping: "ACHATS",
                protocol: "Les Instructions :",
                reality: "Réalité",
                rescue: "Trouver de l'aide",
                footer: "Version Tactique",
                unit: "$",
                tiers: {
                    5: { label: "LE SOL", protocol: "Focus sur l'amidon en petit format. Eau en volume pour couper la faim.", reality: "CRITIQUE : Moins de 5$ en 2026 nécessite une aide externe." },
                    10: { label: "FONDATION", protocol: "Avoine le matin. Riz + 1 œuf le soir. Haricots pour les protéines.", reality: "STABLE : Juste du carburant." },
                    15: { label: "LE TAMPON", protocol: "Ajout de graisses saines. Le beurre de cacahuète est votre base.", reality: "SÉCURISÉ : Gras ajouté pour le cerveau." },
                    20: { label: "LE SOMMET", protocol: "Profil nutritionnel complet. Faites sauter les légumes.", reality: "OPTIMAL : Groupes alimentaires couverts." },
                    25: { label: "EFFICACITÉ", protocol: "Rotation riz/pâtes pour éviter l'épuisement mental.", reality: "VARIÉTÉ : Charge mentale réduite." },
                    30: { label: "TRANSITION", protocol: "Ajout d'aromates. Les oignons redonnent de la dignité au repas.", reality: "HUMAIN : On cuisine, on ne se nourrit plus seulement." }
                }
            },
            es: {
                title: "PRESUPUESTO",
                subtitle: "Logística de Supervivencia",
                selector: "Seleccione Capital Actual:",
                shopping: "COMPRAS",
                protocol: "Instrucciones:",
                reality: "Realidad",
                rescue: "Buscar Ayuda",
                footer: "Versión Táctica",
                unit: "$",
                tiers: {
                    5: { label: "EL SUELO", protocol: "Focus en almidón, bolsas pequeñas. Mucha agua para saciar.", reality: "CRÍTICO: Menos de $5 requiere ayuda externa." },
                    10: { label: "FUNDACIÓN", protocol: "Avena por la mañana. Arroz + 1 huevo por la noche. Frijoles.", reality: "ESTABLE: Solo combustible." },
                    15: { label: "EL TAMPÓN", protocol: "Grasas saludables. Mantequilla de maní para calorías.", reality: "SEGURO: Grasa para el cerebro." },
                    20: { label: "LA CIMA", protocol: "Perfil nutricional completo. Verduras con el arroz.", reality: "OPTIMAL: Nutrición básica alcanzada." },
                    25: { label: "EFICIENCIA", protocol: "Alternar arroz y pasta. Harina para galletas.", reality: "VARIEDAD: Menos carga mental." },
                    30: { label: "TRANSICIÓN", protocol: "Cebollas y picante. Recuperando la dignidad al comer.", reality: "HUMANO: Ya no solo sobrevive, cocina." }
                }
            }
        };

        const DATA_MAP = {
            CA: {
                5: [{ item: "900g Rice (No Name)", cost: "2.75" }, { item: "450g Dried Lentils", cost: "2.25" }],
                10: [{ item: "900g Rice", cost: "2.75" }, { item: "1kg Oats", cost: "3.25" }, { item: "6 Large Eggs", cost: "2.50" }, { item: "Can of Beans", cost: "1.50" }],
                15: [{ item: "Tier $10 Base", cost: "10.00" }, { item: "Peanut Butter (500g)", cost: "3.75" }, { item: "White Bread", cost: "1.25" }],
                20: [{ item: "Tier $15 Base", cost: "15.00" }, { item: "Frozen Spinach", cost: "2.25" }, { item: "2kg Carrots", cost: "1.75" }, { item: "Veg Oil (500ml)", cost: "1.00" }],
                25: [{ item: "Tier $20 Base", cost: "20.00" }, { item: "900g Pasta", cost: "1.75" }, { item: "Pasta Sauce", cost: "1.75" }, { item: "Flour (1kg)", cost: "1.50" }],
                30: [{ item: "Tier $25 Base", cost: "25.00" }, { item: "Bag of Onions", cost: "2.50" }, { item: "Salt/Pepper", cost: "1.50" }, { item: "Hot Sauce", cost: "1.00" }]
            },
            US: {
                5: [{ item: "2lb White Rice", cost: "2.50" }, { item: "1lb Lentils", cost: "2.50" }],
                10: [{ item: "2lb Rice", cost: "2.50" }, { item: "18oz Oats", cost: "2.50" }, { item: "12 Eggs", cost: "3.50" }, { item: "Black Beans (Can)", cost: "1.00" }],
                15: [{ item: "Tier $10 Base", cost: "9.50" }, { item: "Peanut Butter", cost: "3.50" }, { item: "Sliced Bread", cost: "2.00" }],
                20: [{ item: "Tier $15 Base", cost: "15.00" }, { item: "Frozen Veg", cost: "2.00" }, { item: "2lb Carrots", cost: "2.00" }, { item: "Veg Oil", cost: "1.00" }],
                25: [{ item: "Tier $20 Base", cost: "20.00" }, { item: "1lb Pasta", cost: "1.50" }, { item: "Marinara Sauce", cost: "2.00" }, { item: "Flour", cost: "1.50" }],
                30: [{ item: "Tier $25 Base", cost: "25.00" }, { item: "Yellow Onions", cost: "2.00" }, { item: "Seasoning Salt", cost: "2.00" }, { item: "Hot Sauce", cost: "1.00" }]
            }
        };

        const App = () => {
            const [lang, setLang] = useState('en');
            const [region, setRegion] = useState('CA');
            const [budget, setBudget] = useState(10);
            
            const t = TRANSLATIONS[lang];
            const tierInfo = t.tiers[budget];
            const shoppingItems = DATA_MAP[region][budget];

            return (
                <div className="h-full flex flex-col p-6 md:p-12 relative overflow-y-auto">
                    {/* SYSTEM OVERLAY */}
                    <div className="flex flex-wrap gap-4 mb-6 z-50">
                        <div className="flex bg-zinc-900 rounded-xl p-1 border border-white/5">
                            {['en', 'fr', 'es'].map(l => (
                                <button 
                                    key={l} onClick={() => setLang(l)}
                                    className={`px-4 py-2 rounded-lg text-[10px] font-black uppercase transition-all ${lang === l ? 'bg-white text-black' : 'text-zinc-600 hover:text-zinc-400'}`}
                                >
                                    {l}
                                </button>
                            ))}
                        </div>
                        <div className="flex bg-zinc-900 rounded-xl p-1 border border-white/5">
                            {['CA', 'US'].map(r => (
                                <button 
                                    key={r} onClick={() => setRegion(r)}
                                    className={`px-4 py-2 rounded-lg text-[10px] font-black uppercase transition-all ${region === r ? 'bg-cyan-400 text-black' : 'text-zinc-600 hover:text-zinc-400'}`}
                                >
                                    {r}
                                </button>
                            ))}
                        </div>
                    </div>

                    <header className="mb-10 border-b-8 border-cyan-400 pb-6">
                        <div className="flex items-center gap-2 mb-2">
                            <Icons.Globe />
                            <span className="text-[12px] font-black uppercase tracking-[0.4em] text-cyan-400">{t.subtitle}</span>
                        </div>
                        <h1 className="text-6xl md:text-9xl font-black italic tracking-tighter uppercase leading-[0.8] text-white">
                            {t.title}
                        </h1>
                    </header>

                    <section className="mb-10 space-y-4">
                        <span className="text-[12px] font-black uppercase tracking-widest text-zinc-500 block mb-4">{t.selector}</span>
                        <div className="grid grid-cols-3 md:grid-cols-6 gap-3">
                            {[5, 10, 15, 20, 25, 30].map(val => (
                                <button 
                                    key={val}
                                    onClick={() => setBudget(val)}
                                    className={`budget-block py-8 rounded-3xl font-black text-3xl italic ${budget === val ? 'active' : 'bg-zinc-900 text-zinc-500'}`}
                                >
                                    {t.unit}{val}
                                </button>
                            ))}
                        </div>
                    </section>

                    <main className="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-8">
                        <div className="lg:col-span-5 space-y-6">
                            <div className="flex items-center justify-between bg-white/5 p-5 rounded-2xl border border-white/5">
                                <div className="flex items-center gap-3">
                                    <Icons.Cart />
                                    <span className="text-sm font-black uppercase tracking-widest text-cyan-400">{tierInfo.label} {t.shopping}</span>
                                </div>
                                <span className="text-[10px] font-black text-zinc-700 uppercase tracking-widest">{region} MARKET DATA</span>
                            </div>
                            <div className="space-y-3">
                                {shoppingItems.map((item, i) => (
                                    <div key={i} className="flex justify-between items-center p-8 bg-zinc-900 rounded-[2.5rem] border-l-8 border-cyan-400 fade-up shadow-xl" style={{animationDelay: `${i*100}ms`}}>
                                        <span className="text-2xl md:text-4xl font-black italic uppercase tracking-tighter">{item.item}</span>
                                        <span className="text-xl font-black text-cyan-400">{t.unit}{item.cost}</span>
                                    </div>
                                ))}
                            </div>
                            {budget === 5 && (
                                <button className="w-full p-8 bg-red-600/10 border-4 border-red-600/20 text-red-500 font-black uppercase tracking-widest text-sm rounded-[3rem] flex items-center justify-center gap-3 hover:bg-red-600 hover:text-white transition-all">
                                    <Icons.Alert /> {t.rescue}
                                </button>
                            )}
                        </div>

                        <div className="lg:col-span-7 flex flex-col gap-6">
                            <div className="bg-cyan-400 text-black p-10 flex flex-col justify-between h-full rounded-[4rem] relative overflow-hidden fade-up shadow-2xl">
                                <div className="scanline"></div>
                                <div className="relative z-10">
                                    <h4 className="text-[12px] font-black uppercase tracking-widest mb-6 bg-black text-white inline-block px-4 py-1">{t.protocol}</h4>
                                    <p className="text-4xl md:text-6xl font-black italic leading-[1] tracking-tight mb-8">
                                        "{tierInfo.protocol}"
                                    </p>
                                </div>
                                <div className="bg-black/10 p-8 rounded-[2.5rem] border border-black/5 relative z-10">
                                    <p className="text-[11px] font-black uppercase mb-3 flex items-center gap-2 font-black"><Icons.Alert /> {t.reality}</p>
                                    <p className="text-xl md:text-2xl font-black leading-tight uppercase tracking-tighter italic">
                                        {tierInfo.reality}
                                    </p>
                                </div>
                            </div>
                        </div>
                    </main>

                    <footer className="mt-16 pt-10 border-t border-white/5 flex justify-between items-center text-[11px] font-black text-zinc-800 uppercase tracking-[0.4em] italic">
                        <span>Survival v3.0</span>
                        <span>{t.footer}</span>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
